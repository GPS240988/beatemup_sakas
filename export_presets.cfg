; Para usa-los em runtime, remova o filtro correspondente e valide o export antes do deploy.
exclude_filter="ajustemobile/*, plugin/*, tests/*, test_project/*, docs/*, tools/*, script/*, migration_bridge/*, scratch/*, *.rar, *.zip, *.ps1, *.sh, *.py, *.md, *.txt, *.log, assets/sprites/characters/chefes/alessandro/_raw_backup/*, assets/sprites/falas do sergio/*, assets/sprites/characters/inimigos/jogador de magic/idle.png, assets/sprites/characters/inimigos/jogador de magic/puch_02.png, assets/backgrounds/maps/bonus1/garagem_polygon.webp, assets/sprites/Itens/frame_001.png, assets/sprites/Itens/frame_003.png, assets/sprites/Itens/frame_013.png, assets/sprites/Itens/frame_014.png, assets/sprites/Itens/frame_020.png, assets/sprites/Itens/frame_021.png, assets/sprites/Itens/frame_022.png, assets/sprites/Itens/item_carta.png, assets/sprites/Itens/playboy.webp, assets/ui/hud/Destruct/fardo1.webp, assets/ui/hud/Destruct/fardo2.webp, assets/ui/hud/Destruct/fardo3.webp, assets/ui/hud/Destruct/fardo4.webp, assets/ui/hud/Destruct/fruta1.webp, assets/ui/hud/Destruct/fruta2.webp, assets/ui/hud/Destruct/fruta3.webp, assets/ui/hud/Destruct/fruta4.webp, assets/ui/hud/Destruct/lixeira_01.webp, assets/ui/hud/Destruct/lixeira_02.webp, assets/ui/hud/Destruct/lixeira_03.webp, assets/ui/hud/Destruct/lixeira_04.webp, assets/ui/hud/hud_coin_icon.png, assets/ui/hud/hud_combo_plate.png, assets/ui/hud/hud_continue_plate.png, assets/ui/hud/hud_portrait_frame.png, assets/ui/hud/modura.webp, assets/ui/hud/speaker_badge_gold.png, assets/ui/hud/molduras_conversa/*, assets/story/ui/moldura_narrativa_ouro.png, assets/story/ui/speaker_badge_gold.png"
export_path="public/index.html"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
