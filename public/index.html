<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Beat 'em Up - Sakas</title>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	<style>
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100%;
		}
		html, body {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: #000;
		}
		body { touch-action: none; overscroll-behavior: none; }
		#canvas {
			display: block;
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			touch-action: none;
			outline: none;
		}
		/* dvh acompanha a área realmente visível no Safari/Chrome mobile,
		   inclusive quando as barras do navegador aparecem ou desaparecem. */
		@supports (height: 100dvh) {
			html, body, #canvas { height: 100dvh; }
		}
		#rotate-overlay {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 9999;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			gap: 0.8rem;
			padding: 2rem;
			box-sizing: border-box;
			background: #080b12;
			color: #f2e6c8;
			font-family: Arial, sans-serif;
			text-align: center;
		}
		#rotate-overlay .icon { font-size: clamp(3rem, 14vw, 5rem); line-height: 1; }
		#rotate-overlay strong { font-size: clamp(1.1rem, 5vw, 1.5rem); letter-spacing: 0.08em; }
		#rotate-overlay span:last-child { max-width: 24rem; color: #b8c0ce; font-size: 0.95rem; line-height: 1.5; }
		#load-error {
			display: none;
			position: fixed;
			inset: auto 1rem 1rem;
			z-index: 10000;
			padding: 1rem;
			border: 1px solid #9b3943;
			border-radius: 0.5rem;
			background: #5b3943;
			color: #fff;
			font: 14px/1.4 Arial, sans-serif;
			white-space: pre-wrap;
		}
		@media (orientation: portrait) and (hover: none) and (pointer: coarse) {
			#canvas { visibility: hidden; }
			#rotate-overlay { display: flex; }
		}

		/* Tela de Carregamento Inicial (Dark Arcade Sakas) */
		#loading-screen {
			position: fixed;
			inset: 0;
			z-index: 9998;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: radial-gradient(circle at center, #141b2d 0%, #080b12 75%, #030408 100%);
			color: #f2e6c8;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			user-select: none;
			transition: opacity 0.4s ease-out;
		}
		.loading-title {
			font-size: clamp(1.8rem, 5vw, 3rem);
			font-weight: 900;
			letter-spacing: 0.15em;
			color: #fff;
			text-transform: uppercase;
			text-shadow: 0 0 10px rgba(255, 60, 90, 0.8), 0 0 25px rgba(255, 30, 70, 0.5);
			margin-bottom: 0.2rem;
		}
		.loading-subtitle {
			font-size: clamp(0.9rem, 2.5vw, 1.3rem);
			font-weight: 700;
			letter-spacing: 0.3em;
			color: #e5b958;
			text-transform: uppercase;
			text-shadow: 0 0 8px rgba(229, 185, 88, 0.6);
			margin-bottom: 2rem;
		}
		.progress-container {
			width: min(80vw, 420px);
			height: 18px;
			background: rgba(10, 14, 24, 0.85);
			border: 2px solid #00d2e0;
			border-radius: 9px;
			overflow: hidden;
			box-shadow: 0 0 14px rgba(0, 210, 224, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.6);
			position: relative;
			margin-bottom: 0.9rem;
		}
		.progress-bar {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #e54260 0%, #e5b958 50%, #00d2e0 100%);
			border-radius: 7px;
			transition: width 0.15s ease-out;
			box-shadow: 0 0 10px rgba(0, 210, 224, 0.8);
		}
		.loading-status {
			font-size: 0.9rem;
			font-weight: 600;
			letter-spacing: 0.12em;
			color: #8ed6de;
			text-transform: uppercase;
			text-shadow: 0 0 6px rgba(0, 210, 224, 0.5);
		}
		.loading-tip {
			margin-top: 1.5rem;
			font-size: 0.8rem;
			color: #7a889b;
			letter-spacing: 0.05em;
		}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0">
		Seu navegador não oferece suporte ao elemento canvas.
	</canvas>
	<div id="loading-screen" role="status" aria-live="polite">
		<div class="loading-title">SAKA'S</div>
		<div class="loading-subtitle">A ÚLTIMA FICHA</div>
		<div class="progress-container">
			<div id="progress-bar" class="progress-bar"></div>
		</div>
		<div id="loading-status" class="loading-status">CARREGANDO... 0%</div>
		<div class="loading-tip">Insira sua ficha e prepare-se para a luta!</div>
	</div>
	<div id="rotate-overlay" role="status" aria-live="polite">
		<span class="icon" aria-hidden="true">↻</span>
		<strong>GIRE O CELULAR</strong>
		<span>O Sakas foi feito para jogar com a tela na horizontal. Vire o aparelho para continuar.</span>
	</div>
	<div id="load-error" role="alert"></div>
	<script src="index.js"></script>
	<script>
		const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":97805816,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"});

		const loadingScreen = document.getElementById('loading-screen');
		const progressBar = document.getElementById('progress-bar');
		const loadingStatus = document.getElementById('loading-status');

		// Navegadores só permitem pedir tela cheia/bloqueio de orientação após gesto do usuário.
		async function requestLandscape() {
			try {
				if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
					await document.documentElement.requestFullscreen();
				}
			} catch (_error) {
				// Tela cheia é opcional; a camada de orientação continua protegendo o jogo.
			}
			try {
				if (screen.orientation && typeof screen.orientation.lock === 'function') {
					await screen.orientation.lock('landscape');
				}
			} catch (_error) {
				// O navegador pode negar o bloqueio; o jogador ainda pode girar o aparelho.
			}
		}
		document.addEventListener('pointerdown', requestLandscape, { once: true, passive: true });

		engine.startGame({
			onProgress: function(current, total) {
				if (total > 0) {
					const percent = Math.min(100, Math.floor((current / total) * 100));
					if (progressBar) progressBar.style.width = percent + '%';
					if (loadingStatus) loadingStatus.textContent = 'CARREGANDO... ' + percent + '%';
				} else {
					if (loadingStatus) loadingStatus.textContent = 'INICIALIZANDO MOTOR...';
				}
			}
		}).then(() => {
			if (loadingScreen) {
				loadingScreen.style.opacity = '0';
				setTimeout(() => {
					if (loadingScreen.parentNode) {
						loadingScreen.parentNode.removeChild(loadingScreen);
					}
				}, 450);
			}
		}).catch((error) => {
			console.error(error);
			if (loadingScreen) loadingScreen.style.display = 'none';
			const message = document.getElementById('load-error');
			message.textContent = error instanceof Error ? error.message : String(error);
			message.style.display = 'block';
		});
	</script>
</body>
</html>
