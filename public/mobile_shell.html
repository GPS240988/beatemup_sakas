<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>$GODOT_PROJECT_NAME</title>
	<meta name="sakas-build-id" content="de655651">
	<meta name="sakas-build-id" content="initial">
	$GODOT_HEAD_INCLUDE
	<style>
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100%;
		}
		html, body {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: #000;
		}
		body { touch-action: none; overscroll-behavior: none; }
		#canvas {
			display: block;
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			touch-action: none;
			outline: none;
		}
		/* dvh acompanha a área realmente visível no Safari/Chrome mobile,
		   inclusive quando as barras do navegador aparecem ou desaparecem. */
		@supports (height: 100dvh) {
			html, body, #canvas { height: 100dvh; }
		}
		#rotate-overlay {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 9999;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			gap: 0.8rem;
			padding: 2rem;
			box-sizing: border-box;
			background: #080b12;
			color: #f2e6c8;
			font-family: Arial, sans-serif;
			text-align: center;
		}
		#rotate-overlay .icon { font-size: clamp(3rem, 14vw, 5rem); line-height: 1; }
		#rotate-overlay strong { font-size: clamp(1.1rem, 5vw, 1.5rem); letter-spacing: 0.08em; }
		#rotate-overlay span:last-child { max-width: 24rem; color: #b8c0ce; font-size: 0.95rem; line-height: 1.5; }
		@media (orientation: portrait) and (hover: none) and (pointer: coarse) {
			#canvas { visibility: hidden; }
			#rotate-overlay { display: flex; }
		}
		#load-error {
			display: none;
			position: fixed;
			inset: auto 1rem 1rem;
			z-index: 10000;
			padding: 1rem;
			border: 1px solid #9b3943;
			border-radius: 0.5rem;
			background: #5b3943;
			color: #fff;
			font: 14px/1.4 Arial, sans-serif;
			white-space: pre-wrap;
		}

		/* Tela de Carregamento Inicial (Dark Arcade Sakas) */
		#loading-screen {
			position: fixed;
			inset: 0;
			z-index: 9998;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: radial-gradient(circle at center, #141b2d 0%, #080b12 75%, #030408 100%);
			color: #f2e6c8;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			user-select: none;
			transition: opacity 0.4s ease-out;
		}
		.loading-title {
			font-size: clamp(1.8rem, 5vw, 3rem);
			font-weight: 900;
			letter-spacing: 0.15em;
			color: #fff;
			text-transform: uppercase;
			text-shadow: 0 0 10px rgba(255, 60, 90, 0.8), 0 0 25px rgba(255, 30, 70, 0.5);
			margin-bottom: 0.2rem;
		}
		.loading-subtitle {
			font-size: clamp(0.9rem, 2.5vw, 1.3rem);
			font-weight: 700;
			letter-spacing: 0.3em;
			color: #e5b958;
			text-transform: uppercase;
			text-shadow: 0 0 8px rgba(229, 185, 88, 0.6);
			margin-bottom: 2rem;
		}
		.progress-container {
			width: min(80vw, 420px);
			height: 18px;
			background: rgba(10, 14, 24, 0.85);
			border: 2px solid #00d2e0;
			border-radius: 9px;
			overflow: hidden;
			box-shadow: 0 0 14px rgba(0, 210, 224, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.6);
			position: relative;
			margin-bottom: 0.9rem;
		}
		.progress-bar {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #e54260 0%, #e5b958 50%, #00d2e0 100%);
			border-radius: 7px;
			transition: width 0.15s ease-out;
			box-shadow: 0 0 10px rgba(0, 210, 224, 0.8);
		}
		.loading-status {
			font-size: 0.9rem;
			font-weight: 600;
			letter-spacing: 0.12em;
			color: #8ed6de;
			text-transform: uppercase;
			text-shadow: 0 0 6px rgba(0, 210, 224, 0.5);
		}
		.loading-tip {
			margin-top: 1.5rem;
			font-size: 0.8rem;
			color: #7a889b;
			letter-spacing: 0.05em;
		}
	</style>
</head>
<body>
	<canvas id="canvas" width="1280" height="720" tabindex="0">
		Seu navegador não oferece suporte ao elemento canvas.
	</canvas>
	<div id="loading-screen" role="status" aria-live="polite">
		<div class="loading-title">SAKA'S</div>
		<div class="loading-subtitle">A ÚLTIMA FICHA</div>
		<div class="progress-container">
			<div id="progress-bar" class="progress-bar"></div>
		</div>
		<div id="loading-status" class="loading-status">CARREGANDO... 0%</div>
		<div class="loading-tip">Insira sua ficha e prepare-se para a luta!</div>
	</div>
	<div id="rotate-overlay" role="status" aria-live="polite">
		<span class="icon" aria-hidden="true">↻</span>
		<strong>GIRE O CELULAR</strong>
		<span>O Sakas foi feito para jogar com a tela na horizontal. Vire o aparelho para continuar.</span>
	</div>
	<div id="load-error" role="alert"></div>
	<script src="$GODOT_URL"></script>
	<script>
		const engine = new Engine($GODOT_CONFIG);

		const loadingScreen = document.getElementById('loading-screen');
		const progressBar = document.getElementById('progress-bar');
		const loadingStatus = document.getElementById('loading-status');
		const mobileDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

		// O manifesto do PWA já declara orientation=landscape. Em navegadores
		// comuns, o bloqueio é solicitado no primeiro gesto permitido pelo browser.
		async function requestLandscape(fromUserGesture = false) {
			if (!mobileDevice) return;

			if (fromUserGesture && !document.fullscreenElement && document.documentElement.requestFullscreen) {
				try {
					await document.documentElement.requestFullscreen();
				} catch (_error) {
					// Alguns navegadores não permitem fullscreen; tentamos o lock mesmo assim.
				}
			}

			try {
				if (screen.orientation && typeof screen.orientation.lock === 'function') {
					await screen.orientation.lock('landscape');
				}
			} catch (_error) {
				// A política do navegador pode exigir instalação PWA ou gesto do usuário.
			}
		}

		// Em PWA instalado, o lock do manifesto atua na abertura. Esta tentativa
		// adicional cobre navegadores que já permitam a API sem gesto.
		if (mobileDevice) {
			void requestLandscape(false);
			document.addEventListener('pointerdown', () => requestLandscape(true), { once: true, passive: true });
		}

		// Tenta fechar a janela no browser. Se window.close() for bloqueado pela
		// política do navegador, mostra uma tela final em vez de deixar o jogo parado.
		window.sakasQuitGame = function () {
			try {
				window.close();
			} catch (_error) {
				// Continua para a tela de encerramento abaixo.
			}
			if (!window.closed) {
				document.body.innerHTML = `
					<main style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;box-sizing:border-box;background:radial-gradient(circle at center,#141b2d 0%,#080b12 75%,#030408 100%);color:#f2e6c8;font-family:Arial,sans-serif;text-align:center">
						<strong style="font-size:clamp(28px,8vw,44px);letter-spacing:.16em;color:#fff;text-shadow:0 0 16px rgba(255,60,90,.55)">SAKA'S</strong>
						<span style="font-size:clamp(16px,4vw,22px);font-weight:700;letter-spacing:.12em;color:#e5b958">JOGO ENCERRADO</span>
						<span style="max-width:28rem;color:#b8c0ce;font-size:15px;line-height:1.5">A sessão foi encerrada. Você já pode fechar esta aba ou janela.</span>
					</main>`;
				document.body.style.cssText = 'margin:0;overflow:hidden;background:#030408';
			}
			return true;
		};

		// --- SAKAS PWA AUTO-UPDATE MANAGER (GODOT WEB / MOBILE) ---
		(function initPwaUpdateManager() {
			if (!('serviceWorker' in navigator)) return;

			let refreshing = false;
			let engineRunning = false;
			let updateToast = null;

			function showUpdateToast() {
				if (updateToast) return;
				updateToast = document.createElement('div');
				updateToast.id = 'sakas-update-toast';
				updateToast.setAttribute('role', 'alert');
				updateToast.innerHTML = `
					<span>NOVA VERSÃO DISPONÍVEL!</span>
					<button id="sakas-update-btn">ATUALIZAR AGORA</button>
				`;
				updateToast.style.cssText = `
					position: fixed;
					top: 14px;
					left: 50%;
					transform: translateX(-50%);
					z-index: 99999;
					display: flex;
					align-items: center;
					gap: 12px;
					padding: 8px 16px;
					background: rgba(14, 20, 32, 0.95);
					border: 1px solid #e5b958;
					border-radius: 8px;
					box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
					color: #f2e6c8;
					font-family: Arial, sans-serif;
					font-size: 13px;
					font-weight: bold;
					letter-spacing: 0.05em;
				`;
				const btn = updateToast.querySelector('#sakas-update-btn');
				btn.style.cssText = `
					background: #e5b958;
					color: #080b12;
					border: none;
					padding: 4px 10px;
					border-radius: 4px;
					font-weight: bold;
					cursor: pointer;
					font-size: 12px;
				`;
				btn.addEventListener('click', () => {
					window.location.reload();
				});
				document.body.appendChild(updateToast);
			}

			function safeReload(targetVersion) {
				if (refreshing) return;
				const reloadedVersion = sessionStorage.getItem('sakas_reloaded_version');
				if (targetVersion && reloadedVersion === targetVersion) {
					console.log('[PWA] Já recarregado nesta sessão para a versão:', targetVersion);
					return;
				}
				refreshing = true;
				sessionStorage.setItem('sakas_reloaded_version', targetVersion || 'updated');
				console.log('[PWA] Recarregando para aplicar nova versão publicada...');
				window.location.reload();
			}

			navigator.serviceWorker.addEventListener('controllerchange', () => {
				console.log('[PWA] Novo Service Worker assumiu o controle.');
				if (!engineRunning) {
					safeReload();
				} else {
					showUpdateToast();
				}
			});

			async function checkForPublishedRelease(registration) {
				try {
					if (registration) {
						registration.update().catch(() => {});
					}
					const resp = await fetch('version.json?_t=' + Date.now(), {
						cache: 'no-store',
						headers: { 'Accept': 'application/json' }
					});
					if (!resp.ok) return;
					const data = await resp.json();
					const serverVersion = data && data.version ? String(data.version) : '';
					if (!serverVersion) return;

					const localMeta = document.querySelector('meta[name="sakas-build-id"]');
					const currentVersion = localMeta ? localMeta.getAttribute('content') : '';

					if (currentVersion && currentVersion !== 'initial' && serverVersion !== currentVersion) {
						console.log(`[PWA] Atualização detectada: ${serverVersion} (local: ${currentVersion})`);
						if (registration && registration.waiting) {
							registration.waiting.postMessage('SKIP_WAITING');
							registration.waiting.postMessage('claim');
						} else if (registration) {
							registration.update().then((reg) => {
								if (reg && reg.waiting) {
									reg.waiting.postMessage('SKIP_WAITING');
									reg.waiting.postMessage('claim');
								}
							});
						}
					}
				} catch (_e) {
					// Offline: falha de rede silenciosa esperada
				}
			}

			function checkWaitingWorker(registration) {
				if (!registration) return;
				if (registration.waiting) {
					console.log('[PWA] Worker em espera detectado. Solicitando ativação...');
					registration.waiting.postMessage('SKIP_WAITING');
					registration.waiting.postMessage('claim');
				}
				registration.addEventListener('updatefound', () => {
					const newWorker = registration.installing;
					if (!newWorker) return;
					newWorker.addEventListener('statechange', () => {
						if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
							console.log('[PWA] Nova versão instalada no cache. Ativando...');
							newWorker.postMessage('SKIP_WAITING');
							newWorker.postMessage('claim');
						}
					});
				});
			}

			navigator.serviceWorker.getRegistration().then((reg) => {
				if (reg) {
					checkWaitingWorker(reg);
					checkForPublishedRelease(reg);
				}
			});

			let lastForegroundCheck = Date.now();
			function onForegroundResume() {
				const now = Date.now();
				if (now - lastForegroundCheck > 45000) {
					lastForegroundCheck = now;
					navigator.serviceWorker.getRegistration().then((reg) => {
						if (reg) {
							checkForPublishedRelease(reg);
						}
					});
				}
			}

			document.addEventListener('visibilitychange', () => {
				if (document.visibilityState === 'visible') {
					onForegroundResume();
				}
			});
			window.addEventListener('focus', onForegroundResume);

			window.sakasNotifyGameStarted = function() {
				engineRunning = true;
			};
		})();

		const modularPacks = [
			'packs/pack_audio_bgm.pck',
			'packs/pack_story_cinematics.pck',
			'packs/pack_stage1.pck'
		];

		// Rastreamento de progresso unificado (motor + todos os pacotes modulares)
		engine.config.onProgress = function(current, total) {
			if (total > 0) {
				const percent = Math.min(100, Math.floor((current / total) * 100));
				if (progressBar) progressBar.style.width = percent + '%';
				if (loadingStatus) loadingStatus.textContent = 'CARREGANDO... ' + percent + '%';
			} else {
				if (loadingStatus) loadingStatus.textContent = 'INICIALIZANDO MOTOR...';
			}
		};

		// Sequencia canonica do Godot 4 Web:
		// 1. Inicializa o ambiente WebAssembly (index.wasm)
		// 2. Pre-carrega index.pck e todos os pacotes modulares (.pck) em paralelo
		// 3. Executa engine.start() somente apos todos estarem montados na memoria virtual
		Promise.all([
			engine.init('index'),
			engine.preloadFile('index.pck', 'index.pck'),
			...modularPacks.map(p => engine.preloadFile(p, p).catch(err => {
				console.warn('[Modular PCK] Aviso ao pre-carregar pacote:', p, err);
			}))
		]).then(() => {
			if (loadingStatus) loadingStatus.textContent = 'INICIANDO MOTOR...';
			engine.config.args = ['--main-pack', 'index.pck'].concat(engine.config.args || []);
			return engine.start();
		}).then(() => {
			if (window.sakasNotifyGameStarted) {
				window.sakasNotifyGameStarted();
			}
			if (loadingScreen) {
				loadingScreen.style.opacity = '0';
				setTimeout(() => {
					if (loadingScreen.parentNode) {
						loadingScreen.parentNode.removeChild(loadingScreen);
					}
				}, 450);
			}
		}).catch((error) => {
			console.error(error);
			if (loadingScreen) loadingScreen.style.display = 'none';
			const message = document.getElementById('load-error');
			message.textContent = error instanceof Error ? error.message : String(error);
			message.style.display = 'block';
		});
	</script>
</body>
</html>
